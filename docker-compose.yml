# Монтуються лише data і models — те, що справді є станом і мусить пережити
# перезапуск. `configs/` тут НЕ монтується, і це не недогляд: Coolify перетворює
# кожен відносний bind-mount на постійний каталог хоста, який засівається один
# раз і більше ніколи не оновлюється деплоями. Поки `./configs` був у цьому
# списку, прод майже рік читав annotator_config.json від 23.08.2025 — без секції
# rubric_detector, тобто з мертвим фільтром рубрик, — тоді як образ приносив
# свіжий код, що той конфіг читає. Конфіги їдуть в образі разом із кодом; два
# файли з секретами створює docker-entrypoint.sh зі змінних середовища.
# Тест tests/test_deployment.py стежить, щоб цей монт не повернувся.
services:
  # Основний контейнер НЯН
  nyan-app:
    build: .
    container_name: nyan-app
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - CLIENT_CONFIG_JSON=${CLIENT_CONFIG_JSON:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NYAN_TIMEZONE=${NYAN_TIMEZONE:-Europe/Kyiv}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-5.4-mini}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-low}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8000}
      - PUBLISH_CHANNEL_URL=${PUBLISH_CHANNEL_URL:-}
      - DIGEST_CHANNEL_ID=${DIGEST_CHANNEL_ID:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MONGO_HOST=${MONGO_HOST:-}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_DATABASE=${MONGO_DATABASE:-main}
      - MONGO_USERNAME=${MONGO_USERNAME:-}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE:-admin}
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-primary}
      - MONGO_SSL=${MONGO_SSL:-false}
      - MONGO_DIRECT_CONNECTION=${MONGO_DIRECT_CONNECTION:-true}
    restart: unless-stopped
    # Тримає контейнер запущеним для ручних команд і дебагу.
    command: ["tail", "-f", "/dev/null"]

  # Crawler сервіс
  nyan-crawler:
    build: .
    container_name: nyan-crawler  
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - CLIENT_CONFIG_JSON=${CLIENT_CONFIG_JSON:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NYAN_TIMEZONE=${NYAN_TIMEZONE:-Europe/Kyiv}
      # Як часто перечитувати канал і як довго спати між проходами.
      - RECRAWL_TIME=${RECRAWL_TIME:-300}
      - CRAWL_INTERVAL=${CRAWL_INTERVAL:-60}
      - MONGO_HOST=${MONGO_HOST:-}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_DATABASE=${MONGO_DATABASE:-main}
      - MONGO_USERNAME=${MONGO_USERNAME:-}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE:-admin}
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-primary}
      - MONGO_SSL=${MONGO_SSL:-false}
      - MONGO_DIRECT_CONNECTION=${MONGO_DIRECT_CONNECTION:-true}
    restart: unless-stopped
    command: ["./crawl.sh"]

  # Sender сервіс  
  nyan-sender:
    build: .
    container_name: nyan-sender
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - CLIENT_CONFIG_JSON=${CLIENT_CONFIG_JSON:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NYAN_TIMEZONE=${NYAN_TIMEZONE:-Europe/Kyiv}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-5.4-mini}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-low}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8000}
      - PUBLISH_CHANNEL_URL=${PUBLISH_CHANNEL_URL:-}
      - DIGEST_CHANNEL_ID=${DIGEST_CHANNEL_ID:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MONGO_HOST=${MONGO_HOST:-}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_DATABASE=${MONGO_DATABASE:-main}
      - MONGO_USERNAME=${MONGO_USERNAME:-}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE:-admin}
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-primary}
      - MONGO_SSL=${MONGO_SSL:-false}
      - MONGO_DIRECT_CONNECTION=${MONGO_DIRECT_CONNECTION:-true}
    restart: unless-stopped
    command: ["./send.sh"]

  nyan-digest:
    build: .
    container_name: nyan-digest
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - CLIENT_CONFIG_JSON=${CLIENT_CONFIG_JSON:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NYAN_TIMEZONE=${NYAN_TIMEZONE:-Europe/Kyiv}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-5.4-mini}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-low}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8000}
      - PUBLISH_CHANNEL_URL=${PUBLISH_CHANNEL_URL:-}
      - DIGEST_CHANNEL_ID=${DIGEST_CHANNEL_ID:-}
      - DIGEST_HOURS=${DIGEST_HOURS:-8,14,18,23}
      - DIGEST_DURATION_HOURS=${DIGEST_DURATION_HOURS:-8}
      - DIGEST_MIN_NEWS=${DIGEST_MIN_NEWS:-5}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MONGO_HOST=${MONGO_HOST:-}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_DATABASE=${MONGO_DATABASE:-main}
      - MONGO_USERNAME=${MONGO_USERNAME:-}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE:-admin}
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-primary}
      - MONGO_SSL=${MONGO_SSL:-false}
      - MONGO_DIRECT_CONNECTION=${MONGO_DIRECT_CONNECTION:-true}
    restart: unless-stopped
    command: ["./digest.sh"]
