# Rules come from pyproject.toml, so the hook, the CI job and a local run
# cannot disagree the way three separate flake8 ignore lists used to.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      # Configs and secrets are easy to commit by accident here.
      - id: detect-private-key
